[settings]
# How often to check, in seconds
check_seconds = 15
# Active hours, New York time (04:00 NY = 09:00 London)
start_ny = 04:00
end_ny = 16:30
# Pop-up notifications bottom-right of the screen (yes / no)
popups = yes
# Keep the window on top of TradingView (yes / no)
always_on_top = yes
# Times (New York) for a "which sectors lead / lag" snapshot
sector_snapshots_ny = 07:00, 08:00, 09:25
# Big names to watch (ticker symbols). Only these get company news, moves and earnings.
big_names = NVDA, MSFT, AAPL, GOOGL, AMZN, META, AVGO, TSLA
# Time (New York) for the 'earnings today / tomorrow' alert
earnings_alert_ny = 07:00
# How many 'top market drivers' to pin at the top, and how big a story must be (lower = more)
top_stories = 4
top_story_level = 7
# Ignore news older than this
max_news_age_minutes = 45
# Oil panel pop-ups: top (only big oil stories), all, or no
oil_popups = top
# Metals panel pop-ups: top (only big gold/silver stories), all, or no
metals_popups = top
# iPhone page over home Wi-Fi (yes / no) and its port
phone = yes
phone_port = 8765

[ai]
# Optional. A Claude API key adds a 2-line "why it matters" note and filters out noise.
anthropic_api_key =
model = claude-haiku-5-5

[sec]
# Optional. Your email lets the bot read official company filings (SEC asks for it).
contact_email =

[telegram]
# Optional, for phone alerts later
bot_token =
chat_id =
